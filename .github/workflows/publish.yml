name: Test and publish Apex League
on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/publish.yml"]
  workflow_dispatch:
permissions:
  contents: write
  packages: write
concurrency:
  group: apex-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install -g pnpm@11.25.0
      - name: Verify source
        working-directory: app
        run: |
          pnpm install --frozen-lockfile
          pnpm exec next typegen
          pnpm check
          pnpm test
      - name: Release details
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./app/package.json').version")
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-qemu-action@v3
        if: steps.release.outputs.exists != 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.release.outputs.exists != 'true'
      - uses: docker/login-action@v3
        if: steps.release.outputs.exists != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish image
        if: steps.release.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.release.outputs.image }}:${{ steps.release.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Announce completed release
        if: steps.release.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          IMAGE: ${{ steps.release.outputs.image }}
        run: |
          printf 'Ready-built image: `%s:%s`\n\n' "$IMAGE" "$VERSION" > release-notes.md
          cat app/RELEASE_NOTES.md >> release-notes.md
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "Apex League $VERSION" --notes-file release-notes.md
